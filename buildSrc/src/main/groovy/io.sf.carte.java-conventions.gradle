plugins {
	id 'java-library'
	id 'maven-publish'
	id 'signing'
	id 'org.gradlex.extra-java-module-info'
}

repositories {
	mavenCentral()
	maven {
		url = "https://css4j.github.io/maven/"
		mavenContent {
			releasesOnly()
		}
		content {
			includeGroupByRegex 'io\\.sf\\..*'
		}
	}
}

group = 'io.sf.carte'
version = '0.1.0-SNAPSHOT'

ext.isReleaseVersion = !version.endsWith("SNAPSHOT")

sourceSets {
	main {
		java {
			srcDirs = ['src']
		}
		resources {
			srcDirs = ['src']
			excludes += ["**/*.java"]
		}
	}
	test {
		java {
			srcDirs = ['junit']
		}
		resources {
			srcDirs = ['junit']
			excludes += ["**/*.java"]
		}
	}
}

java {
	sourceCompatibility = JavaVersion.VERSION_11
	withJavadocJar()
	withSourcesJar()
	registerFeature('jfreechart') {
		usingSourceSet(sourceSets.main)
	}
	registerFeature('xchart') {
		usingSourceSet(sourceSets.main)
	}
}

dependencies {
	implementation "io.sf.carte:xml-dtd:${xmlDtdVersion}"
	api "io.sf.carte:css4j:${css4jVersion}"
	implementation "nu.validator:htmlparser:${htmlparserVersion}"
}

extraJavaModuleInfo {
	automaticModule("htmlparser-${htmlparserVersion}.jar", 'htmlparser')
	automaticModule('com.madgag:animated-gif-lib', 'com.madgag.gif.fmsware')
	automaticModule('commons-logging:commons-logging', 'commons.logging')
	automaticModule('de.erichseifert.vectorgraphics2d:VectorGraphics2D', 'de.erichseifert.vectorgraphics2d')
}

compileJava {
	dependsOn configurations.compileClasspath
	classpath = sourceSets.main.compileClasspath
	options.release = 11
}

// Check bytecode version, in case some other task screws it
tasks.register('checkBytecodeVersion') {
	description = 'Check that classes are Java 11 bytecode'
	enabled = enabled && !project.getPluginManager().hasPlugin('eclipse')
	def classdir = sourceSets.main.output.classesDirs.files.stream().findAny().get()
	def classfiles = fileTree(classdir).matching({it.exclude('module-info.class')}).files
	doFirst() {
		if (!classfiles.isEmpty()) {
			def classfile = classfiles.stream().findAny().get()
			if (classfile != null) {
				def classbytes = classfile.bytes
				def bcversion = classbytes[6] * 128 + classbytes[7]
				if (bcversion != 52) {
					throw new GradleException("Bytecode on " + classfile +
						" is not valid Java 11. Version should be 55, instead is " + bcversion)
				}
			}
		}
	}
}

classes.finalizedBy checkBytecodeVersion
jar.dependsOn checkBytecodeVersion

publishing {
	publications {
		maven(MavenPublication) {
			from(components.java)
			pom {
				url = "https://github.com/css4j/carte/wiki"
				licenses {
					license {
						name = "BSD 2-clause license"
						url = "https://raw.githubusercontent.com/css4j/carte/refs/heads/master/LICENSE.txt"
					}
				}
				scm {
					connection = "scm:git:https://github.com/css4j/carte.git"
					developerConnection = "scm:git:git://git@github.com:css4j/carte.git"
					url = "https://github.com/css4j/carte"
				}
			}
			suppressAllPomMetadataWarnings()
		}
	}
	repositories {
		maven {
			name = 'mavenRepo'
			/*
			 * The following section applies to the 'publish' task:
			 *
			 * If you plan to deploy to a repository, please configure the
			 * 'mavenReleaseRepoUrl' and/or 'mavenSnapshotRepoUrl' properties
			 * (for example in GRADLE_USER_HOME/gradle.properties).
			 *
			 * Otherwise, Gradle shall create a 'build/repository' subdirectory
			 * at ${rootDir} and deploy there.
			 *
			 * Properties 'mavenRepoUsername' and 'mavenRepoPassword' can also
			 * be set (generally from command line).
			 */
			def releasesUrl
			def snapshotsUrl
			if (project.hasProperty('mavenReleaseRepoUrl') && project.mavenReleaseRepoUrl) {
				releasesUrl = mavenReleaseRepoUrl
			} else {
				releasesUrl = "${buildDir}/repository/releases"
			}
			if (project.hasProperty('mavenSnapshotRepoUrl') && project.mavenSnapshotRepoUrl) {
				snapshotsUrl = mavenSnapshotRepoUrl
			} else {
				snapshotsUrl = "${buildDir}/repository/snapshots"
			}
			url = version.endsWith('-SNAPSHOT') ? snapshotsUrl : releasesUrl
			if (project.hasProperty('mavenRepoUsername') &&
					project.hasProperty('mavenRepoPassword')) {
				credentials.username = mavenRepoUsername
				credentials.password = mavenRepoPassword
			}
		}
	}
}

signing {
	required = { isReleaseVersion && gradle.taskGraph.hasTask("publish") }
	def signingKeyId = findProperty('SIGNINGKEYID')
	def signingPassword = findProperty('signingPassword')
	def signingKey
	if (System.env['ORG_GRADLE_PROJECT_SIGNINGKEY'] != null) {
		signingKey = findProperty('SIGNINGKEY')
	} else {
		def signingKeyFile = findProperty('signingSecretKeyFile')
		if (signingKeyFile != null) {
			signingKey = file(signingKeyFile).getText()
		}
	}
	useInMemoryPgpKeys(signingKeyId, signingKey, signingPassword)
	sign publishing.publications.maven
}

tasks.withType(JavaCompile) {
	options.encoding = 'UTF-8'
}

tasks.withType(Javadoc) {
	options.addStringOption('encoding', 'UTF-8')
	options.addStringOption('charset', 'UTF-8')
	options.links 'https://docs.oracle.com/en/java/javase/11/docs/api/'
}

tasks.register('lineEndingConvCopy', CRLFConvertCopy) {
	description = 'Convert LICENSE.txt to Windows line endings'
	from "$rootDir/LICENSE.txt"
}

tasks.withType(AbstractArchiveTask).configureEach {
	// Reproducible build
	preserveFileTimestamps = false
	reproducibleFileOrder = true
	// Copy license file
	dependsOn lineEndingConvCopy
	from ("$buildDir/tmp/crlf/LICENSE.txt") {
		into 'META-INF'
	}
}
